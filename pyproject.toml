[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence-cli"
version = "0.1.0"
description = "A CLI tool for extracting structured information from text documents."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Michael BAG", email= "michaelbag8@gmail.com" }
]
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.13",
    "mypy>=1.18",
]

[project.scripts]
docintel = "docintel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true